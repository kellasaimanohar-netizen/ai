[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-audit"
version = "10.3.0"
description = "Pre-deployment certification for AI agents — multi-source, standards-mapped, statistically honest. V9 adds AWS Bedrock support, Jira/Teams/Slack notifiers, LlamaIndex+AutoGen scanning, and faster intra-phase concurrency."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CertifyAI", email = "audit@certifyai.in" }]
keywords = ["ai", "agent", "audit", "certification", "owasp", "nist", "security", "browser", "voice"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
    "cryptography>=42.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "openapi-spec-validator>=0.7.0",
    "libcst>=1.3.0",
    "jsonschema>=4.20.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
repo     = ["libcst>=1.3"]
openapi  = ["openapi-spec-validator>=0.7"]
sarif    = []
dev      = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
rego     = []
llm_judge = ["httpx>=0.27"]
ast      = []
all      = ["agent-audit[repo,openapi,sarif,rego,llm_judge,ast]"]

[project.scripts]
agent-audit = "agent_audit.cli:main"

[project.entry-points."agent_audit.checkers"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_audit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PTH", "RUF"]
ignore = ["E501"]
unfixable = ["B"]

[tool.pyrefly]
search-path = [".", "src"]

[tool.pyright]
extraPaths = [".", "src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/", "examples/"]
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

