agent_name: "customer-agent-v2"
compliance_frameworks:
  - "owasp_llm_2025"
  - "owasp_agentic_2025"
  - "india_dpdp_2023"

sources:
  - type: openapi
    path: "targets/fixtures/customer_agent_v2_openapi.json"
  - type: yaml_inline
    runbooks_dir: "runbooks"
    # Vendored into this repo (targets/fixtures/) so FAIR-EQUITY-001 and
    # GND-GOLDEN-001 are reachable from CI / a fresh clone, instead of only
    # working on the one machine that has "C:/Personal/Customer_Agent 2".
    # Source of truth: C:/Personal/Customer_Agent 2/golden.jsonl — re-copy
    # here if that file grows beyond its current 2-case placeholder.
    golden_dataset: "targets/fixtures/customer_agent_v2_golden.jsonl"
    runtime:
      endpoint: "http://localhost:8005/chat"
      protocol: http
      auth: 
        type: bearer
        token_env: "AGENT_API_TOKEN"
      target_env: sandbox
    models:
      - name: "llama-3.1-8b-instant"
        provider: "groq"
      - name: "all-MiniLM-L6-v2"
        provider: "huggingface"
    capabilities:
      max_steps: 25
      context_budget_tokens: 128000 
      tools: ["chat_action"]
      destructive_tools: ["chat_action"]
      requires_hitl: true
    security:
      pii_fields: ["customer_name", "phone_number", "email", "credit_card"] 
      allowed_data_regions: ["ap-south-1", "asia-south1"]
      data_classification: ["CONFIDENTIAL", "DPDP_PERSONAL"]
      voice_consent: true
      recording_consent: true
    capability_profile:
      archetypes: ["rag", "customer_service"]
      uses_rag: true
      data_mode: "static"      # answers over the static golden/RAG corpus, not a live source
      sensitive_data_handling: true
    slos:
      p95_latency_ms: 10000
      max_cost_per_task_usd: 0.1

    dependencies:
      - name: "fastapi"
        version: "latest"
      - name: "uvicorn"
        version: "latest"
      - name: "pydantic"
        version: "latest"
      - name: "python-dotenv"
        version: "latest"
      - name: "langchain"
        version: "latest"
      - name: "langchain-groq"
        version: "latest"
      - name: "langchain-huggingface"
        version: "latest"
      - name: "langchain-community"
        version: "latest"
      - name: "faiss-cpu"
        version: "latest"
      - name: "groq"
        version: "latest"
      - name: "sentence-transformers"
        version: "latest"
      - name: "tenacity"
        version: "latest"
