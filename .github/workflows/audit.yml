name: CertifyAI CI/CD — v10

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily drift check

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,all]"
      - run: pip install -r requirements.txt
      - run: ruff check src/ tests/
        continue-on-error: true
      - run: mypy src/agent_audit/ --ignore-missing-imports
        continue-on-error: true
      - run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  framework-validation:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend-build]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]"
      - run: pip install -r requirements.txt
      - name: Run full v10 audit validation
        run: |
          agent-audit run \
            --target targets/my_agent_v4.yaml \
            --mode validate \
            --variability-runs 3 \
            --phase all \
            --output report.json \
            --sarif report.sarif \
            --html report.html \
            --cert-output certificate.json
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/report.sarif
          category: agent-audit-v10
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report-v10
          path: |
            backend/report.json
            backend/report.sarif
            backend/report.html
            backend/certificate.json
